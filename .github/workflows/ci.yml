name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typecheck
        env:
          GITHUB_TOKEN: ci-typecheck-placeholder
      - run: npm run typecheck
      - run: npm run test:api-contract
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ci-build-placeholder
          INSTALL_CLIENT_HASH_SECRET: ci-install-secret-that-is-at-least-32-bytes

  cli-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cli
