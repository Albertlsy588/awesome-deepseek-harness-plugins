name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typecheck
        env:
          GITHUB_TOKEN: ci-typecheck-placeholder
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ci-build-placeholder
