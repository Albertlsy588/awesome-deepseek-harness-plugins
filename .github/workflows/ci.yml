name: CI

# Deliberately push-to-main only, never pull_request: fork PR code must never be
# installed, built, or executed by this repository's CI. The only workflow that
# looks at a PR is plugin-review.yml, which treats the submitted checkout as data.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
