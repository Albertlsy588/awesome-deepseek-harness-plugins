name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/dsh-1024store/**'
      - 'catalog/categories.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Detect Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not configured; skipping the Cloudflare deployment. Configure CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) to enable automatic deploys."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cloudflare.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cloudflare.outputs.available == 'true'
      - run: npm run build
        if: steps.cloudflare.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ci-build-placeholder
          INSTALL_CLIENT_HASH_SECRET: ci-install-secret-that-is-at-least-32-bytes
      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply CATALOG_DB --remote
      - name: Deploy the Worker
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
